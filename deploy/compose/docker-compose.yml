# Docker Compose stack for the CAD Slice 1 on-prem baseline.
#
# Local development:
#
#   cp deploy/compose/.env.example deploy/compose/.env
#   docker compose -f deploy/compose/docker-compose.yml up --build -d
#
# The full stack proves the Slice 1 contract end-to-end:
# postgres + minio + bucket init + migrator + server + web.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cad}
      POSTGRES_USER: ${POSTGRES_USER:-cad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cad-pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cad} -d ${POSTGRES_DB:-cad}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - cad-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/sh', '/scripts/01-make-bucket.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-cad-artifacts}
    volumes:
      - ./minio-init:/scripts:ro

  migrator:
    build:
      context: ../..
      dockerfile: deploy/compose/migrator.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cad}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-cad}

  server:
    build:
      context: ../..
      dockerfile: deploy/compose/server.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_TIME_WINDOW_SECONDS: ${RATE_LIMIT_TIME_WINDOW_SECONDS:-60}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cad}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-cad}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:-cad-artifacts}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?required}
      COOKIE_SECRET: ${COOKIE_SECRET:?required}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    ports:
      - '${SERVER_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
      args:
        VITE_PREFILL_LOGIN_EMAIL: ${ADMIN_EMAIL:-}
        VITE_PREFILL_LOGIN_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-5173}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  cad-pg-data:
  cad-minio-data:
